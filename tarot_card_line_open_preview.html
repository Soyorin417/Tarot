<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>构成主义塔罗卡背 · 线条展开动画</title>
<style>
:root{color-scheme:light;font-family:ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#eee6d9;color:#211b25;min-height:100vh;display:grid;place-items:center}
#tarot-morph-demo{width:min(100%,900px);padding:30px 18px 24px;text-align:center; background:radial-gradient(ellipse at 50% 30%,#f8f2e8 0%,#eee6d9 72%);}
.demo-head{letter-spacing:.16em;font-size:11px;font-weight:800;color:#be2947;margin-bottom:9px}
h1{font-size:clamp(18px,3.4vw,27px);margin:0 0 8px;font-weight:900;letter-spacing:.05em}
.desc{font-size:13px;color:#766b69;margin:0 0 24px}
.stage{display:flex;align-items:center;justify-content:center;min-height:480px;position:relative}
.stage:before{content:'';position:absolute;width:480px;max-width:96%;height:420px;background:radial-gradient(ellipse,#f5ddcf 0%,#f7ede4 45%,transparent 73%);pointer-events:none}
.card{position:relative;display:block;width:280px;height:400px;padding:0;border:0;background:transparent;cursor:pointer;isolation:isolate;overflow:visible;outline-offset:9px;-webkit-tap-highlight-color:transparent;transform:none!important;}
.card svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 16px 20px rgba(29,21,26,.18));transition:filter .65s ease}
.card:is(:hover,:focus-visible,.locked) svg{filter:drop-shadow(0 17px 24px rgba(32,22,25,.22));}
.card::after{content:'';position:absolute;inset:0;z-index:-1;box-shadow:0 0 0 0 rgba(241,49,78,0);border-radius:11px;transition:box-shadow .65s ease}
.card:is(:hover,:focus-visible,.locked)::after{box-shadow:0 0 0 6px rgba(241,49,78,.06),0 0 35px rgba(241,49,78,.12)}
.card .part{transition: transform .72s cubic-bezier(.2,.85,.14,1),opacity .55s ease;transform-box:view-box;}
.card .tl{transform:translate(0,0)}.card .tr{transform:translate(0,0)}.card .bl{transform:translate(0,0)}.card .br{transform:translate(0,0)}
.card .wing-l,.card .wing-r,.card .wing-t,.card .wing-b{transform:translate(0,0)}
.card .line-l,.card .line-r{transform:translate(0,0)}
.card .core{transform-origin:140px 200px; transform:scale(1);transition:transform .72s cubic-bezier(.2,.85,.14,1)}
.card .expansion{opacity:.25;transition:opacity .5s ease .03s}
.card .rail{opacity:.52;transition:opacity .55s ease}
.card:is(:hover,:focus-visible,.locked) .tl{transform:translate(-16px,-19px)}
.card:is(:hover,:focus-visible,.locked) .tr{transform:translate(16px,-19px)}
.card:is(:hover,:focus-visible,.locked) .bl{transform:translate(-16px,19px)}
.card:is(:hover,:focus-visible,.locked) .br{transform:translate(16px,19px)}
.card:is(:hover,:focus-visible,.locked) .wing-l{transform:translate(-22px,0)}
.card:is(:hover,:focus-visible,.locked) .wing-r{transform:translate(22px,0)}
.card:is(:hover,:focus-visible,.locked) .wing-t{transform:translate(0,-21px)}
.card:is(:hover,:focus-visible,.locked) .wing-b{transform:translate(0,21px)}
.card:is(:hover,:focus-visible,.locked) .line-l{transform:translate(-9px,-5px)}
.card:is(:hover,:focus-visible,.locked) .line-r{transform:translate(9px,5px)}
.card:is(:hover,:focus-visible,.locked) .core{transform:scale(1.17)}
.card:is(:hover,:focus-visible,.locked) .expansion{opacity:.96}
.card:is(:hover,:focus-visible,.locked) .rail{opacity:.95}
.caption{font-size:12px;color:#6d6263;margin:16px 0 0;letter-spacing:.08em}
.indicators{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:12px}
.pill{border:1px solid #ccbcb0;background:#f9f3e9;padding:6px 12px;border-radius:20px;transition:background .3s,border-color .3s,color .3s}
.pill.released{background:#252029;color:#fff;border-color:#252029}
.card:is(:hover,:focus-visible,.locked) ~ .indicators .released{background:#f9f3e9;color:#514a4e;border-color:#ccbcb0}
.card:is(:hover,:focus-visible,.locked) ~ .indicators .opened{background:#ed2e4c;color:#fff;border-color:#ed2e4c}
@media (prefers-reduced-motion:reduce){.card .part,.card .core,.card .expansion,.card .rail,.card svg,.card:after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<section id="tarot-morph-demo">
<div class="demo-head">CONSTRUCTIVIST TAROT / CARD BACK</div>
<h1>卡面线条 · 张开与收拢</h1>
<p class="desc">悬停展开 · 移开收拢 · 点击锁定（便于手机预览）</p>
<div class="stage">
<button id="card" class="card" type="button" aria-label="塔罗卡背，悬停展开，点击锁定" aria-pressed="false">
<svg viewBox="0 0 280 400" role="img" aria-label="无白色椭圆环的黑红几何塔罗卡背，内部菱形和线条可展开" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="artclip"><rect x="21" y="21" width="238" height="358" rx="2"/></clipPath>
  <linearGradient id="blackplate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211924"/><stop offset="1" stop-color="#141017"/></linearGradient>
</defs>
<!-- 固定卡纸与边框：始终不动 -->
<rect width="280" height="400" rx="10" fill="url(#blackplate)"/>
<rect x="11" y="11" width="258" height="378" rx="4" fill="none" stroke="#F3E5D4" stroke-width="1.8"/>
<rect x="18" y="18" width="244" height="364" rx="2" fill="none" stroke="#897B7B" stroke-width=".7"/>
<g stroke="#EEDCCC" fill="none" stroke-width="1.2">
 <path d="M30 73V30H75 M205 30H250V73 M30 327V370H75 M205 370H250V327"/>
</g>
<g fill="#F12D4F"><path d="M140 35L147 46L140 57L133 46Z"/><path d="M140 365L147 354L140 343L133 354Z"/></g>
<g clip-path="url(#artclip)">
 <!-- 辅助引导线：固定，用微弱对比保证卡面层次 -->
 <g stroke="#D4A47F" fill="none" stroke-width=".65" opacity=".26">
  <path d="M30 126L250 275 M30 275L250 126 M71 33L209 367 M209 33L71 367"/>
 </g>
 <!-- 中央结构：展开时红菱形四条边各自向四角滑出，不改变卡外框 -->
 <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
  <g class="part tl"><path d="M140 100L65 200" stroke="#F32D4E" stroke-width="7"/><path d="M138 117L83 189" stroke="#B41D36" stroke-width="1.6"/></g>
  <g class="part tr"><path d="M140 100L215 200" stroke="#F32D4E" stroke-width="7"/><path d="M142 117L197 189" stroke="#B41D36" stroke-width="1.6"/></g>
  <g class="part bl"><path d="M65 200L140 300" stroke="#F32D4E" stroke-width="7"/><path d="M83 211L138 283" stroke="#B41D36" stroke-width="1.6"/></g>
  <g class="part br"><path d="M215 200L140 300" stroke="#F32D4E" stroke-width="7"/><path d="M197 211L142 283" stroke="#B41D36" stroke-width="1.6"/></g>
 </g>
 <!-- 机械式折翼：左右和上下均独立张开 -->
 <g class="part wing-l" fill="none" stroke="#E8C4A0">
   <path d="M65 169L38 186L65 200L38 214L65 231" stroke-width="1.9"/>
   <path d="M38 186L51 186 M38 214L51 214" stroke="#F32D4E" stroke-width="4"/>
 </g>
 <g class="part wing-r" fill="none" stroke="#E8C4A0">
   <path d="M215 169L242 186L215 200L242 214L215 231" stroke-width="1.9"/>
   <path d="M242 186L229 186 M242 214L229 214" stroke="#F32D4E" stroke-width="4"/>
 </g>
 <g class="part wing-t" fill="none" stroke="#E8C4A0">
   <path d="M107 119L140 80L173 119" stroke-width="1.5"/>
   <path d="M115 109L140 91L165 109" stroke="#F32D4E" stroke-width="2"/>
 </g>
 <g class="part wing-b" fill="none" stroke="#E8C4A0">
   <path d="M107 281L140 320L173 281" stroke-width="1.5"/>
   <path d="M115 291L140 309L165 291" stroke="#F32D4E" stroke-width="2"/>
 </g>
 <!-- 交错的双向构成线段，在 hover 时向外平移 -->
 <g class="part line-l" fill="none" stroke="#D0A578" stroke-width="1.25">
   <path d="M42 129H83 M47 137H72 M48 271H87 M48 279H68"/>
   <path d="M70 145L88 159 M70 255L88 241" stroke="#F32D4E" stroke-width="1.4"/>
 </g>
 <g class="part line-r" fill="none" stroke="#D0A578" stroke-width="1.25">
   <path d="M197 129H238 M208 137H233 M193 271H232 M212 279H232"/>
   <path d="M210 145L192 159 M210 255L192 241" stroke="#F32D4E" stroke-width="1.4"/>
 </g>
 <!-- 展开后浮现的次级细线（仍然没有环） -->
 <g class="expansion" fill="none" stroke="#F0DCC4" stroke-width="1.1">
   <path d="M140 141V161 M140 239V259 M85 200H108 M172 200H195"/>
   <path d="M91 151L112 172 M189 151L168 172 M91 249L112 228 M189 249L168 228" stroke="#D49D6C"/>
 </g>
 <!-- 正中的星芒 -->
 <g class="core">
   <path d="M140 169L147 193L171 200L147 207L140 231L133 207L109 200L133 193Z" fill="#F0E4D2"/>
   <path d="M140 186L143.5 196.5L154 200L143.5 203.5L140 214L136.5 203.5L126 200L136.5 196.5Z" fill="#F32D4E"/>
   <circle cx="140" cy="200" r="5" fill="#211924"/>
   <circle cx="140" cy="200" r="2.1" fill="#F0E4D2"/>
 </g>
</g>
<!-- 外框切口点：固定 -->
<g class="rail" fill="none" stroke="#D6AF88" stroke-width="1.2">
 <path d="M56 83V106 M224 294V317 M224 83V106 M56 294V317"/>
</g>
</svg>
</button>
</div>
<p class="caption">外框固定 / 菱形四边分离 / 内部折翼向外张开 / 放开反向收拢</p>
<div class="indicators"><span class="pill released" id="closed-state">收紧</span><span style="color:#ab7d74">↔</span><span class="pill" id="opened-state">张开</span></div>
</section>
<script>
const card=document.getElementById('card'),closed=document.getElementById('closed-state'),opened=document.getElementById('opened-state');
function sync(){const state=card.classList.contains('locked')||card.matches(':hover')||card.matches(':focus-visible');closed.classList.toggle('released',!state);opened.classList.toggle('released',state);closed.style.background=state?'#f9f3e9':'';closed.style.color=state?'#514a4e':'';opened.style.background=state?'#ed2e4c':'';opened.style.color=state?'#fff':'';card.setAttribute('aria-pressed',String(card.classList.contains('locked')));}
card.addEventListener('click',()=>{card.classList.toggle('locked');sync()});
card.addEventListener('pointerenter',sync);card.addEventListener('pointerleave',sync);card.addEventListener('focus',sync);card.addEventListener('blur',sync);
</script>
</body>
</html>
