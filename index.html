<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今日塔罗 · 22张大阿卡那</title>
<style>
:root{
  --bg0:#07060d;
  --bg1:#110c1c;
  --bg2:#1c1230;
  --ink:#f5efff;
  --muted:#9f92b5;
  --gold:#e5ca8f;
  --violet:#b584ff;
  --violet2:#7b44d7;
  --glass:rgba(255,255,255,.055);
  --line:rgba(229,202,143,.18);
  --cardW:240px;
  --cardH:400px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07060d;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
body{overflow-x:hidden;background:
radial-gradient(circle at 50% -10%,rgba(132,75,201,.28),transparent 35%),
radial-gradient(circle at 10% 80%,rgba(48,80,160,.2),transparent 35%),
linear-gradient(145deg,var(--bg0),var(--bg1) 48%,#07060d)}
button,input,textarea,select{font:inherit}
button{color:inherit}

.bg-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#threeBg{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 12%,rgba(72,38,110,.10),transparent 34%),
    radial-gradient(circle at 82% 78%,rgba(24,46,102,.09),transparent 28%),
    radial-gradient(circle at 18% 82%,rgba(74,35,92,.07),transparent 26%),
    linear-gradient(180deg,#010106 0%,#03030a 38%,#05040d 68%,#020207 100%);
}
#threeBg::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at center, transparent 42%, rgba(0,0,0,.14) 74%, rgba(0,0,0,.34) 100%);
}
#threeBg canvas{
  display:block;
  width:100%;
  height:100%;
}

.aurora{position:absolute;border-radius:50%;filter:blur(80px);opacity:.2;mix-blend-mode:screen;animation:auroraMove 15s ease-in-out infinite alternate}
.aurora.a{width:460px;height:460px;left:-130px;top:10%;background:#7131d8}
.aurora.b{width:560px;height:560px;right:-180px;top:35%;background:#264fb2;animation-delay:-4s}
.aurora.c{width:390px;height:390px;left:38%;bottom:-180px;background:#a862c7;animation-delay:-8s}
@keyframes auroraMove{to{transform:translate(80px,-45px) scale(1.18)}}
.starfield,.starfield:before,.starfield:after{
  position:absolute;content:"";inset:-120px;
  background-image:
  radial-gradient(circle,#fff 1px,transparent 1.2px),
  radial-gradient(circle,#b28aff .8px,transparent 1px);
  background-size:95px 95px,151px 151px;
  background-position:0 0,45px 35px;
  opacity:.17;
  animation:driftStars 46s linear infinite;
}
.starfield:before{transform:scale(.7);opacity:.2;animation-duration:70s}
.starfield:after{transform:scale(1.25);opacity:.08;animation-duration:95s}
@keyframes driftStars{to{transform:translate3d(80px,-140px,0)}}

.shell{width:min(1220px,95vw);margin:auto;min-height:100vh;padding:28px 0 50px;position:relative;z-index:2}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
.brand{text-align:left}
.brand small{display:block;color:var(--muted);letter-spacing:4px;font-size:11px;margin-bottom:5px}
.brand h1{margin:0;font:400 clamp(28px,4vw,48px)/1.1 Georgia,serif;letter-spacing:.18em;background:linear-gradient(90deg,#fff,#dcbfff,var(--gold),#fff);background-size:220% auto;-webkit-background-clip:text;color:transparent;animation:titleFlow 7s linear infinite}
@keyframes titleFlow{to{background-position:220% center}}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn,.primary,.ghost{
  border:1px solid rgba(205,173,255,.22);
  background:rgba(23,17,36,.66);
  backdrop-filter:blur(12px);
  border-radius:999px;
  padding:10px 16px;
  cursor:pointer;
  transition:.25s ease;
  box-shadow:inset 0 1px rgba(255,255,255,.04)
}
.icon-btn:hover,.primary:hover,.ghost:hover{transform:translateY(-2px);border-color:rgba(211,180,255,.55);box-shadow:0 10px 28px rgba(77,36,125,.25)}
.primary{background:linear-gradient(90deg,rgba(121,70,179,.72),rgba(76,49,124,.8));border-color:rgba(207,170,255,.48);letter-spacing:2px}
.ghost{color:#cfc4de}
.date{color:#877c98;font-size:12px;letter-spacing:3px;margin-top:7px}

.stage{
  position:relative;min-height:690px;margin-top:12px;border:1px solid rgba(255,255,255,.05);
  border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));
  overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.04)
}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(145,95,213,.11),transparent 36%);pointer-events:none}
.rune-ring,.rune-ring2{
  position:absolute;left:50%;top:48%;translate:-50% -50%;width:520px;height:520px;border-radius:50%;
  border:1px solid rgba(203,169,248,.13);animation:ringRotate 30s linear infinite;pointer-events:none
}
.rune-ring:before{content:"✦  ☾  △  ✧  ☉  ♢  ☽  ✦  ♄  ✧  ☿  ☾";position:absolute;inset:-18px;border-radius:50%;color:rgba(215,188,250,.22);font-size:18px;letter-spacing:16px;text-align:center;line-height:520px}
.rune-ring:after{content:"";position:absolute;inset:58px;border:1px dashed rgba(226,198,255,.09);border-radius:50%}
.rune-ring2{width:380px;height:380px;border-style:dashed;opacity:.6;animation-direction:reverse;animation-duration:22s}
@keyframes ringRotate{to{rotate:360deg}}
.orbit{position:absolute;left:50%;top:48%;translate:-50% -50%;width:620px;height:620px;pointer-events:none;animation:ringRotate 52s linear infinite}
.orbit i{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;box-shadow:0 0 10px #d4b0ff,0 0 22px #8e55da}
.orbit i:nth-child(1){left:50%;top:0}
.orbit i:nth-child(2){right:6%;top:26%}
.orbit i:nth-child(3){left:8%;bottom:20%}
.orbit i:nth-child(4){right:20%;bottom:8%}

.center-copy{position:absolute;left:50%;top:49%;translate:-50% -50%;text-align:center;width:min(540px,80%);z-index:1;transition:.5s}
.center-copy .sigil{font-size:46px;color:#d5bbfb;text-shadow:0 0 25px rgba(182,126,255,.5);animation:sigilPulse 2.6s ease-in-out infinite}
@keyframes sigilPulse{50%{transform:scale(1.08);filter:brightness(1.3)}}
.center-copy h2{margin:12px 0 8px;font:400 28px/1.2 Georgia,serif;letter-spacing:6px}
.center-copy p{margin:0;color:#9387a5;line-height:1.9;font-size:13px;letter-spacing:1px}
.action-area{position:absolute;left:50%;bottom:34px;translate:-50% 0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:center}
.action-area .primary{min-width:180px;padding:13px 24px}
.status{position:absolute;left:50%;bottom:92px;translate:-50% 0;color:#b3a5c8;font-size:12px;letter-spacing:3px;opacity:0;transition:.35s;z-index:18}
.status.show{opacity:1;animation:statusBlink 1.6s ease-in-out infinite}
@keyframes statusBlink{50%{opacity:.45}}

.deck{position:absolute;left:50%;top:46%;width:190px;height:316px;translate:-50% -50%;z-index:7;cursor:pointer;filter:drop-shadow(0 24px 28px rgba(0,0,0,.45));transition:.55s cubic-bezier(.2,.8,.2,1);animation:deckFloat 3s ease-in-out infinite}
@keyframes deckFloat{50%{translate:-50% calc(-50% - 11px)}}
.deck-card{position:absolute;inset:0;border-radius:16px;border:1px solid rgba(216,185,255,.35);background:linear-gradient(145deg,#1b122b,#0a0711)}
.deck-card:nth-child(1){transform:translate(-8px,8px) rotate(-3deg)}
.deck-card:nth-child(2){transform:translate(8px,5px) rotate(3deg)}
.deck-card:nth-child(3){padding:9px}
.back-pattern{height:100%;border:1px solid rgba(228,204,255,.46);border-radius:11px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at center,rgba(126,74,188,.22),transparent 42%)}
.back-pattern:before,.back-pattern:after{content:"";position:absolute;width:116px;height:116px;border:1px solid rgba(196,154,242,.55);transform:rotate(45deg)}
.back-pattern:after{width:84px;height:84px;border-radius:50%;transform:none}
.back-pattern span{position:relative;z-index:2;font-size:42px;color:#e0c9ff;text-shadow:0 0 22px #9a55ea;animation:eyePulse 2s ease-in-out infinite}
@keyframes eyePulse{50%{transform:scale(1.12) rotate(4deg)}}
.deck.hidden{opacity:0;transform:scale(.72);pointer-events:none}
.deck.shuffling{animation:none}
.deck.shuffling .deck-card:nth-child(1){animation:shuffleL .38s ease-in-out 5}
.deck.shuffling .deck-card:nth-child(2){animation:shuffleR .38s ease-in-out 5}
.deck.shuffling .deck-card:nth-child(3){animation:shuffleC .38s ease-in-out 5}
@keyframes shuffleL{50%{transform:translate(-110px,-10px) rotate(-16deg)}}
@keyframes shuffleR{50%{transform:translate(110px,-8px) rotate(16deg)}}
@keyframes shuffleC{50%{transform:translateY(-30px) rotate(3deg)}}

.choice-layer{position:absolute;inset:0;z-index:9;pointer-events:none}
.choice-card{
  position:absolute;left:50%;top:47%;width:142px;height:236px;margin-left:-71px;margin-top:-118px;border-radius:13px;
  background:linear-gradient(145deg,#1b122c,#0c0815);border:1px solid rgba(216,184,255,.4);
  box-shadow:0 20px 45px rgba(0,0,0,.35);opacity:0;transform-origin:50% 150%;transition:.5s cubic-bezier(.2,.8,.2,1);cursor:pointer;pointer-events:auto;padding:7px
}
.choice-card .back-pattern span{font-size:30px}
.choice-card.show{opacity:1}
.choice-card:hover{filter:brightness(1.25);translate:0 -16px;box-shadow:0 26px 55px rgba(95,48,145,.36)}
.choice-card.selected{z-index:30;transition:1s cubic-bezier(.16,.84,.25,1);filter:brightness(1.14)}

.hero-card{
  width:var(--cardW);height:var(--cardH);position:absolute;left:50%;top:46%;margin-left:calc(var(--cardW)/-2);margin-top:calc(var(--cardH)/-2);
  perspective:1600px;z-index:35;opacity:0;pointer-events:none;transition:opacity .3s
}
.hero-card.visible{opacity:1;pointer-events:auto}
.hero-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.2,.75,.18,1)}
.hero-card.open .hero-inner{transform:rotateY(180deg)}
.hero-face,.hero-back{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.55),0 0 55px rgba(127,73,192,.14)}
.hero-back{padding:10px;border:1px solid rgba(225,196,255,.5);background:linear-gradient(145deg,#1c132e,#090610)}
.hero-front{transform:rotateY(180deg);padding:7px;background:linear-gradient(145deg,#f2e7cb,#ccb182);color:#2d2134;border:1px solid rgba(239,215,170,.75)}
.face-shell{height:100%;border:2px solid rgba(55,41,67,.72);border-radius:11px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(0,0,0,.03));transition:.5s}
.face-shell.reversed{transform:rotate(180deg)}
.face-shell:before{content:"";position:absolute;inset:10px;border:1px solid rgba(61,42,69,.16);border-radius:7px}
.hero-image{width:100%;height:auto;flex:1;min-height:0;margin:6px 0;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.72),rgba(197,165,117,.16) 44%,transparent 72%);overflow:hidden;position:relative}
.hero-image img{width:100%;height:100%;object-fit:contain;display:none}
.hero-image .default-symbol{font-size:92px;filter:drop-shadow(0 8px 3px rgba(0,0,0,.17));animation:symbolHover 3s ease-in-out infinite}
@keyframes symbolHover{50%{transform:translateY(-7px) rotate(2deg)}}
.hero-num{font:14px Georgia,serif;z-index:1}
.hero-name{text-align:center;font:400 22px Georgia,serif;letter-spacing:3px;z-index:1}
.hero-en{font-size:9px;letter-spacing:2px;opacity:.6;margin-top:4px}
.card-glint{position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 49%,transparent 62%);transform:translateX(-55%) rotate(8deg);opacity:0;pointer-events:none}
.hero-card.open .card-glint{animation:glint 1.6s .75s ease-out}
@keyframes glint{0%{opacity:0;transform:translateX(-55%) rotate(8deg)}30%{opacity:.65}100%{opacity:0;transform:translateX(55%) rotate(8deg)}}
.hero-card.reveal-in{animation:heroFly 1s cubic-bezier(.18,.8,.2,1)}
@keyframes heroFly{0%{opacity:0;transform:translateY(60px) scale(.62) rotate(8deg)}60%{opacity:1;transform:translateY(-20px) scale(1.05) rotate(-2deg)}100%{opacity:1;transform:none}}

.flash{position:absolute;left:50%;top:46%;width:110px;height:110px;margin:-55px;border-radius:50%;background:radial-gradient(circle,#fff 0 5%,rgba(231,204,255,.9) 12%,rgba(171,106,255,.42) 35%,transparent 70%);opacity:0;z-index:31;pointer-events:none}
.flash.go{animation:flashBurst 1.1s ease-out}
@keyframes flashBurst{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(7)}}
.particle{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:9999;background:white;box-shadow:0 0 8px #fff,0 0 18px #b06fff;animation:particleFly var(--dur,1.6s) cubic-bezier(.12,.75,.25,1) forwards}
@keyframes particleFly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(.2) rotate(360deg)}}
.ripple-star{position:fixed;pointer-events:none;z-index:9998;color:#e6d1ff;text-shadow:0 0 12px #a36cff;animation:starPop 1.1s ease-out forwards}
@keyframes starPop{0%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1}100%{opacity:0;transform:scale(1.8) rotate(140deg) translateY(-18px)}}

.result-panel{
  position:absolute;right:34px;top:36px;width:min(410px,38%);max-height:610px;overflow:auto;padding:22px;border:1px solid rgba(255,255,255,.07);
  border-radius:22px;background:rgba(10,8,16,.56);backdrop-filter:blur(18px);box-shadow:0 22px 50px rgba(0,0,0,.22);
  opacity:0;transform:translateX(34px);pointer-events:none;transition:.7s cubic-bezier(.2,.8,.2,1);z-index:18
}
.result-panel.show{opacity:1;transform:none;pointer-events:auto}
.result-kicker{font-size:11px;color:#c4a2f1;letter-spacing:3px}
.result-title{font:400 28px Georgia,serif;margin:7px 0 8px}
.result-keywords{color:#cab9da;font-size:13px;line-height:1.7}
.result-summary{color:#b6aabe;font-size:13px;line-height:1.9;margin:18px 0}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-item{padding:13px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:rgba(255,255,255,.03);opacity:0;transform:translateY(12px)}
.result-panel.show .result-item{animation:resultIn .55s forwards}
.result-panel.show .result-item:nth-child(1){animation-delay:.18s}
.result-panel.show .result-item:nth-child(2){animation-delay:.3s}
.result-panel.show .result-item:nth-child(3){animation-delay:.42s}
.result-panel.show .result-item:nth-child(4){animation-delay:.54s}
@keyframes resultIn{to{opacity:1;transform:none}}
.result-item b{display:block;color:#9c82b8;font-size:11px;letter-spacing:2px;margin-bottom:6px}
.result-item span{font-size:12px;line-height:1.65;color:#ddd3e6}
.advice{margin-top:12px;padding:14px 15px;border-left:2px solid #a66fe2;background:linear-gradient(90deg,rgba(111,63,160,.16),transparent);font-size:12px;line-height:1.8;color:#dbd0e5}
.reset-row{display:flex;gap:8px;margin-top:14px}
.reset-row button{flex:1}

.editor-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.editor-mask.show{opacity:1;pointer-events:auto}
.editor{
  position:fixed;right:0;top:0;width:min(520px,95vw);height:100vh;z-index:100;background:#100c18;border-left:1px solid rgba(255,255,255,.08);
  box-shadow:-20px 0 70px rgba(0,0,0,.5);transform:translateX(100%);transition:.4s cubic-bezier(.2,.8,.2,1);padding:22px;overflow:auto
}
.editor.show{transform:none}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-22px;padding:18px 0 14px;background:linear-gradient(#100c18 80%,transparent);z-index:2}
.editor h3{margin:0;font:400 24px Georgia,serif;letter-spacing:3px}
.editor p.note{color:#897d98;font-size:12px;line-height:1.7;margin:5px 0 18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
.field.full{grid-column:1/-1}
.field label{display:block;color:#9f90b1;font-size:11px;letter-spacing:1px;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:rgba(255,255,255,.035);color:#f3ecfb;padding:10px 11px;outline:none
}
.field textarea{min-height:86px;resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(181,132,255,.55)}
.upload-box{border:1px dashed rgba(202,169,245,.28);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;margin-top:10px}
.preview{width:74px;height:110px;border-radius:9px;background:#21172f;overflow:hidden;display:grid;place-items:center;color:#8e7aa4;font-size:11px;flex:0 0 auto}
.preview img{width:100%;height:100%;object-fit:contain}
.editor-actions{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:-22px;padding:16px 0 22px;background:linear-gradient(transparent,#100c18 30%)}
.editor-actions button{flex:1}

.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;z-index:200;background:rgba(18,13,27,.9);border:1px solid rgba(209,175,255,.25);padding:11px 16px;border-radius:999px;color:#e8ddf4;font-size:12px;letter-spacing:1px;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;translate:-50% 0}

@media(max-width:980px){
  .stage{min-height:980px}
  .result-panel{left:50%;right:auto;top:auto;bottom:120px;translate:-50% 20px;width:min(660px,88%);max-height:370px}
  .result-panel.show{transform:none;translate:-50% 0}
  .hero-card{top:35%}
  .deck{top:35%}
  .choice-card{top:36%}
  .rune-ring,.rune-ring2,.orbit{top:36%}
  .flash{top:35%}
  .center-copy{top:37%}
}
@media(max-width:650px){
  :root{--cardW:210px;--cardH:350px}
  .topbar{align-items:flex-start;flex-direction:column}
  .tools{justify-content:flex-start}
  .stage{min-height:1000px}
  .rune-ring{width:420px;height:420px}.rune-ring:before{line-height:420px}
  .rune-ring2{width:300px;height:300px}.orbit{width:470px;height:470px}
  .choice-card{width:112px;height:187px;margin-left:-56px;margin-top:-93px}
  .result-grid{grid-template-columns:1fr}
  .result-panel{bottom:120px;max-height:430px}
  .action-area{width:90%}
  .action-area .primary{min-width:0;flex:1}
  .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
}
/* ========== 构成主义塔罗：红 × 黑 × 米白，完整卡面 ========== */
:root {
  --bg0:#e9dfcf; --bg1:#f4eee3; --bg2:#e2d5c2;
  --ink:#211820; --muted:#77686a; --gold:#d8ae83;
  --violet:#f12d49; --violet2:#bd1939;
  --glass:rgba(255,255,255,.55); --line:rgba(35,23,29,.16);
  --cardW:288px; --cardH:460.8px;
  --paper:#f3e9d7; --red:#ed2443; --blood:#a81331; --black:#1c1620;
}
html,body {background:#eee6d8; color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
body {background:
  radial-gradient(circle at 85% 15%,#f7f0e4 0,transparent 36%),
  repeating-linear-gradient(90deg,rgba(45,26,34,.025) 0 1px,transparent 1px 88px),
  #eee6d8}
#threeBg,.bg-layer {display:none!important}
.shell {width:min(1360px,calc(100% - 64px));padding:24px 0 32px}
.topbar {border-bottom:2px solid var(--black);padding-bottom:18px;margin-bottom:16px;gap:22px}
.brand {position:relative}
.brand small {color:var(--blood);font-size:10px;letter-spacing:3.2px;font-weight:900;margin-bottom:6px}
.brand small b {padding:0 8px;color:var(--black)}
.brand h1 {font-family:"Microsoft YaHei",system-ui,sans-serif;font-size:clamp(32px,3.7vw,51px);font-weight:900;letter-spacing:.16em;line-height:1.2;color:var(--black);background:none;-webkit-text-fill-color:currentColor;animation:none}
.brand h1 span {color:var(--red)}
.date {font-size:11px;letter-spacing:2px;color:#786b70;margin-top:5px;font-weight:700}
.tools {gap:9px}
.icon-btn,.primary,.ghost {border:1.5px solid var(--black);border-radius:2px;backdrop-filter:none;box-shadow:none;transition:transform .2s,background .2s,color .2s; font-size:12px;font-weight:800;letter-spacing:.7px;cursor:pointer}

.card-back-art .expansion{opacity:.25;transition:opacity .5s ease .03s}
.card-back-art .rail{opacity:.52;transition:opacity .55s ease}
.card-back-surface:is(:hover,:focus-visible,.selected) .tl{transform:translate(-16px,-19px)}
.card-back-surface:is(:hover,:focus-visible,.selected) .tr{transform:translate(16px,-19px)}

.card-back-surface:is(:hover,:focus-visible,.selected) .wing-b{transform:translate(0,21px)}
.card-back-surface:is(:hover,:focus-visible,.selected) .line-l{transform:translate(-9px,-5px)}

.card-back-surface:is(:hover,:focus-visible,.selected) .core{transform:scale(1.17)}
.card-back-surface:is(:hover,:focus-visible,.selected) .expansion{opacity:.96}
.card-back-surface:is(:hover,:focus-visible,.selected) .rail{opacity:.95}
.choice-card:focus-visible{outline:3px solid var(--red);outline-offset:5px}
@media(prefers-reduced-motion:reduce){.card-back-art .part,.card-back-art .core,.card-back-art .expansion,.card-back-art .rail{transition-duration:.01ms!important}}

<div id="threeBg" aria-hidden="true"></div>
<div class="bg-layer">
  <div class="aurora a"></div><div class="aurora b"></div><div class="aurora c"></div>
</div>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <small>THE DAILY DIVINATION <b>／</b> MAJOR ARCANA</small>
      <h1>今日<span>塔罗</span></h1>
      <div class="date" id="dateText"></div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="soundBtn">♪ 音效：开</button>
      <button class="icon-btn" id="editBtn">✎ 编辑卡牌</button>
      <button class="icon-btn" id="clearTodayBtn">↻ 重抽今天</button>
    </div>
  </div>

  <section class="stage" id="stage" aria-label="今日塔罗抽牌区域">
    <div class="stage-index" aria-hidden="true">TAROT / MMXXVI</div>
    <div class="rune-ring"></div><div class="rune-ring2"></div>
    <div class="orbit"><i></i><i></i><i></i><i></i></div>

    <div class="center-copy" id="intro">
      <div class="sigil">✦ <span>ARCANA / 00—21</span></div>
      <h2>选择今日的指引</h2>
      <p>22 张大阿卡那 · 正逆位共 44 张独立卡面。<br>先洗牌，再从展开的牌阵中选择一张。</p>
    </div>

    <div class="deck" id="deck" aria-label="塔罗牌堆">
      <div class="deck-card"></div>
      <div class="deck-card"></div>
      <div class="deck-card"></div>
    </div>

    <div class="choice-layer" id="choiceLayer"></div>

    <div class="hero-card" id="heroCard">
      <div class="hero-inner" id="heroInner">
        <div class="hero-back"></div>
        <div class="hero-front">
          <div class="face-shell" id="faceShell">
            <div class="hero-num" id="heroNum">0</div>
            <div class="hero-image">
              <img id="heroImg" alt="">
              <div class="default-symbol" id="heroSymbol">✦</div>
            </div>
            <div>
              <div class="hero-name" id="heroName">愚者</div>
              <div class="hero-en" id="heroEn">THE FOOL</div>
            </div>
            <div class="card-glint"></div>

    </div>

    <div class="flash" id="flash"></div>
    <div class="status" id="status"></div>

    <aside class="result-panel" id="resultPanel">
      <div class="reading-head">

        <h2 class="result-title" id="resultTitle"></h2>
        <p class="result-summary" id="resultSummary"></p>
        <p class="reading-instruction">点选卡牌四周的词条，读一读此刻的不同侧面</p>

<div class="editor-mask" id="editorMask"></div>
<aside class="editor" id="editor">
  <div class="editor-head">
    <div>
      <h3>卡牌编辑器</h3>
      <p class="note">默认自动加载 HTML 所在目录下 image 文件夹中的 44 张 PNG。也可分别替换正位 / 逆位卡图并修改牌义；修改内容仅保存在当前浏览器。</p>
    </div>
    <button class="ghost" id="closeEditorBtn">关闭</button>
  </div>

  <div class="field">
    <label>选择卡牌</label>
    <select id="cardSelect"></select>
  </div>

  <div class="upload-box">
    <div class="preview" id="uprightPreview">正位预览</div>
    <div style="flex:1;min-width:0">
      <div class="field" style="margin:0 0 8px">
        <label>正位卡面（默认读取：image/英文牌名.png）</label>
        <input type="file" id="uprightInput" accept="image/*">
      </div>
      <button class="ghost" id="resetUprightBtn" type="button">恢复文件夹正位图片</button>
    </div>
  </div>
  <div class="upload-box">
    <div class="preview" id="reversedPreview">逆位预览</div>
    <div style="flex:1;min-width:0">
      <div class="field" style="margin:0 0 8px">
        <label>逆位卡面（默认读取：image/英文牌名 Reverse.png）</label>
        <input type="file" id="reversedInput" accept="image/*">
      </div>
      <button class="ghost" id="resetReversedBtn" type="button">恢复文件夹逆位图片</button>
    </div>
  </div>

  <div class="form-grid" style="margin-top:14px">
    <div class="field">
      <label>牌名</label>
      <input id="fName">
    </div>
    <div class="field">
      <label>英文名</label>
      <input id="fEn">
    </div>
    <div class="field">
      <label>编号 / 点数</label>
      <input id="fNumber">
    </div>
    <div class="field">
      <label>默认符号</label>
      <input id="fSymbol">
    </div>

    <div class="field full"><label>正位关键词（用 · 分隔前三个词条）</label><input id="uKeywords"></div>
    <div class="field full"><label>正位总述</label><textarea id="uSummary"></textarea></div>
    <div class="field"><label>正位词条 1</label><textarea id="uNote1"></textarea></div>
    <div class="field"><label>正位词条 2</label><textarea id="uNote2"></textarea></div>
    <div class="field"><label>正位词条 3</label><textarea id="uNote3"></textarea></div>
    <div class="field"><label>正位自问</label><textarea id="uQuestion"></textarea></div>

    <div class="field full"><label>逆位关键词（用 · 分隔前三个词条）</label><input id="rKeywords"></div>
    <div class="field full"><label>逆位总述</label><textarea id="rSummary"></textarea></div>
    <div class="field"><label>逆位词条 1</label><textarea id="rNote1"></textarea></div>
    <div class="field"><label>逆位词条 2</label><textarea id="rNote2"></textarea></div>
    <div class="field"><label>逆位词条 3</label><textarea id="rNote3"></textarea></div>
    <div class="field"><label>逆位自问</label><textarea id="rQuestion"></textarea></div>
  </div>

  <div class="editor-actions">
    <button class="ghost" id="resetCardBtn">恢复默认</button>
    <button class="primary" id="saveCardBtn">保存修改</button>
  </div>
</aside>

<div class="toast" id="toast"></div>


<script>
const roman = ["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
const majorBase = [
["愚者","THE FOOL","🪽","新的开始 · 自由 · 冒险"],
["魔术师","THE MAGICIAN","✦","创造 · 行动 · 掌控"],
["女祭司","THE HIGH PRIESTESS","☾","直觉 · 安静 · 洞察"],

["隐者","THE HERMIT","✧","独处 · 思考 · 内省"],
["命运之轮","WHEEL OF FORTUNE","☸","变化 · 机会 · 转折"],
["正义","JUSTICE","⚖","公平 · 理性 · 决策"],
["倒吊人","THE HANGED MAN","◇","暂停 · 换位思考 · 等待"],
["死神","DEATH","☠","结束 · 转变 · 新生"],
["节制","TEMPERANCE","△","平衡 · 调和 · 恢复"],
["恶魔","THE DEVIL","♠","欲望 · 执着 · 诱惑"],
["高塔","THE TOWER","⚡","突发 · 打破 · 重建"],
["星星","THE STAR","★","希望 · 灵感 · 治愈"],
["月亮","THE MOON","☽","未知 · 情绪 · 潜意识"],
["太阳","THE SUN","☀","快乐 · 成功 · 活力"],
["审判","JUDGEMENT","♬","觉醒 · 决定 · 新阶段"],
["世界","THE WORLD","◎","完成 · 圆满 · 成果"]
];

// 文件名与本地 PNG 完全一致，包括特殊的「Wheel of Fortune」大小写。
const majorImageNames = [
  "The Fool","The Magician","The High Priestess","The Empress",
  "The Emperor","The Hierophant","The Lovers","The Chariot",
  "Strength","The Hermit","Wheel of Fortune","Justice",
  "The Hanged Man","Death","Temperance","The Devil",
  "The Tower","The Star","The Moon","The Sun","Judgement","The World"
];
// 相对路径指向 HTML 同目录的 image 子文件夹，file:/// 直接双击打开也能使用。
const localCardImage = (name, reversed=false) =>
  `./image/${encodeURIComponent(name + (reversed ? " Reverse" : "") + ".png")}`;

// 每组依次是：总述、三个关键词的展开、留给自己的问题。
const majorReadings = [
  {up:["你正站在尚未命名的起点。未知不是空白，而是一种邀请。","开始不需要完整地图；第一步会让道路慢慢显形。","自由是为自己的选择留出空间，不急着证明它正确。","冒险也许不在远方，而在愿意松开熟悉的边界。","如果暂时不必保证结果，你想先向哪里迈步？"],rev:["脚步想向前，心却还在寻找安全的边界。先看清顾虑，再决定是否跨出。","迟疑未必是退缩，它可能在提醒你补上一块地基。","真正的自由也包括说不，或暂时停在原地。","留意冲动背后的空缺，别让逃离被误认作探索。","你在等待时机，还是在等待一个永远不会出现的保证？"]},
  {up:["你手中的资源正在聚拢。意念与行动之间，只差一个清晰的开端。","创造从看见已有之物开始，而不是等待完美条件。","把念头带入现实，微小动作也能改变它的重量。","掌控不是握紧一切，而是辨认自己真正能触及的部分。","你现在最想赋予形状的念头是什么？"],rev:["力量仍在，只是可能被分散、怀疑或表面的忙碌遮住。","灵感过多时，先选择一个值得停留的方向。","行动若只为证明自己，容易离初衷越来越远。","有些失控来自过度用力；放松也是一种技艺。","你想运用这份能力，还是只想被看见有能力？"]},
  {up:["有些答案不在眼前的声音里。安静下来，细微之处会逐渐清晰。","直觉不是仓促的结论，它常在反复凝视后浮现。","安静可以成为容器，让尚未成形的感受有地方停靠。","洞察始于承认：还有一部分故事没有被说出。","你隐约知道、却还没有允许自己承认的是什么？"],rev:["内心的声音可能被噪音或猜测盖过。先分清感觉与恐惧。","不要逼迫直觉立即给出确定答案。","沉默若变成回避，就需要给真实感受一个出口。","未知并不等于危险，也不必靠想象填满。","你是在倾听内在，还是在寻找让焦虑停下的解释？"]},
  {up:["生长正在发生，未必需要催促。给予空间，事物会按自己的节奏展开。","丰盛不只来自拥有，也来自能够感受和分享。","温柔不是软弱，它让脆弱之处有继续生长的可能。","成长需要滋养，也需要允许过程不那么整齐。","此刻有什么值得你耐心照料，而非立刻评判？"],rev:["滋养的流动可能暂时停滞。留意你是否把自己放在了最后。","匮乏感有时来自看不见已经存在的支持。","温柔也需要边界，否则容易变成耗尽自己。","生长暂缓时，可以先为土壤留出呼吸的空隙。","你愿意把给予他人的体谅，也分给自己一点吗？"]},
  {up:["清楚的边界让力量有了方向。稳定来自你愿意承担的选择。","秩序不是僵硬，而是为重要之事留出可靠的结构。","稳固的力量无需时时证明自己。","决定可以坚定，也可以保留对新信息的开放。","哪一条边界能让你更安心地成为自己？"],rev:["过紧的结构可能正在限制呼吸。看看哪些规则仍为你服务。","秩序失去弹性时，保护也会变成束缚。","不必把所有重量都放在自己肩上。","越想掌控全局，越需要看见无法掌控的部分。","如果稍微松开手，真正会失去的是什么？"]},
  {up:["经验与传承可以成为路标，也值得由你亲自理解。","传统保存了许多答案，却不必替你回答全部问题。","学习是与他人的智慧对话，而非交出自己的判断。","指引应帮助你看清，而不是替你决定。","哪些信念是你真心认同的，哪些只是一直沿用？"],rev:["熟悉的答案也许不再贴合眼前的路。允许自己重新提问。","旧规则与当下的感受若有距离，值得认真辨认。","质疑并不等于否定一切，它也能让理解更深。","你的方向可能不在现成模板里。","若暂时放下“应该”，你会怎样描述自己的信念？"]},

function buildMajor(){
  return majorBase.map((m,i)=>{
    const makeReading=parts=>({summary:parts[0],notes:parts.slice(1,4),question:parts[4]});
    return {
      id:`major-${i}`, number:roman[i], name:m[0], en:m[1], symbol:m[2],
      imageUpright:localCardImage(majorImageNames[i]),
      imageReversed:localCardImage(majorImageNames[i],true),
      upright:{keywords:m[3],reading:makeReading(majorReadings[i].up)},
      reversed:{keywords:m[3],reading:makeReading(majorReadings[i].rev)}
    };
  });
}

let cardBackSerial=0;
function mountCardBack(element){
  const art=$("cardBackTemplate").content.querySelector("svg").cloneNode(true);
  const suffix=++cardBackSerial;
  art.querySelector("#cardBackClip").id=`cardBackClip-${suffix}`;
  art.querySelector("#cardBackPlate").id=`cardBackPlate-${suffix}`;
  art.querySelector('[clip-path="url(#cardBackClip)"]').setAttribute("clip-path",`url(#cardBackClip-${suffix})`);
  art.querySelector('[fill="url(#cardBackPlate)"]').setAttribute("fill",`url(#cardBackPlate-${suffix})`);
  element.classList.add("card-back-surface");
  element.replaceChildren(art);
}

function deepClone(o){return JSON.parse(JSON.stringify(o))}
function loadDeck(){
  try{
    const saved=JSON.parse(localStorage.getItem(CUSTOM_KEY)||"{}");
    return DEFAULT_DECK.map(card=>saved[card.id]?mergeCard(card,saved[card.id]):deepClone(card));
  }catch(e){return deepClone(DEFAULT_DECK)}
}
function mergeCard(base,custom){
  const merged={
    ...deepClone(base),...custom,
    upright:{...deepClone(base.upright),...(custom.upright||{}),reading:{...deepClone(base.upright.reading),...(custom.upright?.reading||{})}},
    reversed:{...deepClone(base.reversed),...(custom.reversed||{}),reading:{...deepClone(base.reversed.reading),...(custom.reversed?.reading||{})}}
  };
  // 兼容旧版编辑器留下的单张自定义卡面。
  if(custom.image && !custom.imageUpright) merged.imageUpright=custom.image;
  // 旧版本的默认逆位词序与当前逐词解读的顺序不同，只迁移默认值。
  const oldReversedKeywords=base.reversed.keywords.split(" · ").reverse().join(" · ")+" · 调整";
  if(custom.reversed?.keywords===oldReversedKeywords) merged.reversed.keywords=base.reversed.keywords;
  // 若曾使用过旧版（图片和 HTML 同目录），自动更新其相对路径。
  for(const prop of ["imageUpright","imageReversed"]){
    const value=merged[prop];
    if(typeof value==="string" && /^\.\/(?!image\/)[^/]+\.png(?:\?.*)?$/i.test(value)){
      merged[prop]="./image/"+value.slice(2);
    }
  }
  return merged;
}
function saveOverrides(){
  const overrides={};
  deckData.forEach((card,i)=>{
    if(JSON.stringify(card)!==JSON.stringify(DEFAULT_DECK[i])) overrides[card.id]=card;
  });
  localStorage.setItem(CUSTOM_KEY,JSON.stringify(overrides));
}

function playTone(type="soft"){
  if(!soundOn)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const ac=new AC();
    const now=ac.currentTime;
    const freqs=type==="open"?[392,523.25,659.25,783.99]:type==="shuffle"?[180,220,260]:[440,554.37];
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=i%2?"sine":"triangle";o.frequency.setValueAtTime(f,now+i*.06);
      g.gain.setValueAtTime(.0001,now+i*.06);g.gain.exponentialRampToValueAtTime(.06,now+i*.06+.02);
      g.gain.exponentialRampToValueAtTime(.0001,now+i*.06+.38);
      o.connect(g).connect(ac.destination);o.start(now+i*.06);o.stop(now+i*.06+.42);
    });
    setTimeout(()=>ac.close(),900);
  }catch(e){}
}

  },2000);

function uniqueRandom(count,max){
  const set=new Set();while(set.size<count)set.add(Math.floor(Math.random()*max));return [...set];
}
function fanChoices(){
  state="choose";els.deck.classList.add("hidden");els.choiceLayer.innerHTML="";
  currentChoiceIndexes=uniqueRandom(7,deckData.length);
  const angles=[-34,-23,-12,0,12,23,34];
  const spread=Math.min(1,Math.max(.50,(window.innerWidth-24)/670));
  const xs=[-240,-165,-85,0,85,165,240].map(x=>Math.round(x*spread));
  const ys=[50,20,2,-5,2,20,50];
  currentChoiceIndexes.forEach((idx,i)=>{
    const c=document.createElement("button");
    c.type="button";
    c.className="choice-card";
    c.setAttribute("aria-label",`选择第 ${i+1} 张牌`);
    mountCardBack(c);
    c.style.transform=`translate(${xs[i]}px,${ys[i]}px) rotate(${angles[i]}deg) scale(.72)`;
    c.dataset.index=idx;
    c.addEventListener("click",()=>chooseCard(c,idx));
    els.choiceLayer.appendChild(c);
    setTimeout(()=>{c.classList.add("show");c.style.transform=`translate(${xs[i]}px,${ys[i]}px) rotate(${angles[i]}deg) scale(1)`},i*90);
  });
  setStatus("SELECT · 从牌阵中选择一张");
  els.mainBtn.textContent="请选择一张牌";
}
function chooseCard(el,index){
  if(state!=="choose")return;
  state="selected";
  current={index,reversed:Math.random()<.5};
  activeReadingIndex=0;
  [...els.choiceLayer.children].forEach(node=>{node.style.pointerEvents="none";if(node!==el)node.style.opacity="0"});
  el.classList.add("selected");
  el.style.transform="translate(0,-10px) rotate(0deg) scale(1.48)";
  playTone("soft");
  setTimeout(()=>{
    els.choiceLayer.innerHTML="";
    prepareHero(deckData[index],current.reversed);
    els.hero.classList.add("visible","reveal-in");
    setStatus("REVEAL · 点击卡牌翻开");
    els.mainBtn.disabled=false;els.mainBtn.textContent="翻开塔罗";
    state="waitingOpen";
  },850);
}
function prepareHero(card,reversed){
  $("heroNum").textContent=card.number;
  $("heroName").textContent=card.name;
  $("heroEn").textContent=card.en;
  els.heroSymbol.textContent=card.symbol||"✦";
  // 逆位直接使用独立绘制的 Reverse.png，不再把正位图旋转 180°。
  els.face.classList.remove("reversed");
  const imagePath=reversed?card.imageReversed:card.imageUpright;
  els.face.classList.remove("image-missing");
  els.heroImg.onerror=()=>{
    els.face.classList.add("image-missing");
    // 缺图时自动显示符号，避免出现浏览器的破图图标。
    els.heroImg.style.display="none";
    els.heroSymbol.style.display="block";
    console.warn("塔罗牌图片未找到：",imagePath);
  };
  if(imagePath){
    els.heroImg.alt=`${card.name}${reversed?"逆位":"正位"}`;
    els.heroImg.style.display="block";els.heroSymbol.style.display="none";
    els.heroImg.src=imagePath;
  }else{
    els.face.classList.add("image-missing");
    els.heroImg.removeAttribute("src");els.heroImg.style.display="none";els.heroSymbol.style.display="block";
  }
  els.hero.classList.remove("open");
}

function burstFromElement(el,count=30){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<count;i++){
    const p=document.createElement(i%5===0?"span":"i");
    if(i%5===0){
      p.className="ripple-star";p.textContent=i%10===0?"✦":"✧";p.style.left=(cx+(Math.random()-.5)*80)+"px";p.style.top=(cy+(Math.random()-.5)*80)+"px";
    }else{
      p.className="particle";const a=Math.random()*Math.PI*2,dist=90+Math.random()*210;
      p.style.left=cx+"px";p.style.top=cy+"px";p.style.setProperty("--x",Math.cos(a)*dist+"px");p.style.setProperty("--y",Math.sin(a)*dist+"px");p.style.setProperty("--dur",(1+Math.random()*1.2)+"s");
    }
    document.body.appendChild(p);setTimeout(()=>p.remove(),2400);
  }
}
function showResult(saveToday=false){
  if(!current)return;
  const card=deckData[current.index],data=current.reversed?card.reversed:card.upright,pos=current.reversed?"逆位":"正位";
  $("resultKicker").textContent=`今日之牌 / ${card.number}`;
  $("resultTitle").textContent=`${card.name} · ${pos}`;
  $("resultSummary").textContent=decodeNumericEntities(data.reading.summary);
  const labels=readingLabels(data);
  document.querySelectorAll(".reading-term").forEach((button,i)=>{
    if(i<3)button.querySelector(".term-label").textContent=labels[i];
  });
  $("readingCardSlot").appendChild(els.hero);
  els.result.classList.add("show");$("stage").classList.add("has-result");els.mainBtn.textContent="今日指引已揭晓";
  renderReading(activeReadingIndex);
  if(saveToday){try{localStorage.setItem(TODAY_KEY,JSON.stringify({date:todayKey(),cardId:card.id,reversed:current.reversed}));}catch(e){console.warn("当前浏览器不允许存储今日记录",e)}}
}
function readingLabels(data){
  const words=String(data.keywords||"").split(/[·、]/).map(word=>word.trim()).filter(Boolean);
  return [words[0]||"起点",words[1]||"内在",words[2]||"方向"];
}
function decodeNumericEntities(value){
  return String(value??"").replace(/&#(?:x([0-9a-f]+)|([0-9]+));/gi,(match,hex,decimal)=>{
    const code=Number.parseInt(hex||decimal,hex?16:10);
    return code<=0x10ffff && (code<0xd800 || code>0xdfff)?String.fromCodePoint(code):match;
  });
}
function renderReading(index){
  if(!current)return;
  activeReadingIndex=Math.max(0,Math.min(3,index));
  const card=deckData[current.index],data=current.reversed?card.reversed:card.upright;
  const labels=readingLabels(data),reading=data.reading;
  const title=activeReadingIndex<3?labels[activeReadingIndex]:"留给自己";
  const detail=activeReadingIndex<3?reading.notes[activeReadingIndex]:reading.question;
  $("readingDetailLabel").textContent=`0${activeReadingIndex+1} / ${title}`;
  $("readingDetailText").textContent=decodeNumericEntities(detail);
  document.querySelectorAll(".reading-term").forEach((button,i)=>button.setAttribute("aria-pressed",String(i===activeReadingIndex)));
}
document.querySelectorAll(".reading-term").forEach(button=>button.addEventListener("click",()=>{
  renderReading(Number(button.dataset.reading));playTone("soft");
}));
function restoreToday(){
  try{
    const saved=JSON.parse(localStorage.getItem(TODAY_KEY)||"null");
    if(!saved||saved.date!==todayKey())return;
    const index=deckData.findIndex(c=>c.id===saved.cardId);if(index<0)return;
    current={index,reversed:!!saved.reversed};prepareHero(deckData[index],current.reversed);
    els.deck.classList.add("hidden");els.intro.style.opacity="0";els.hero.classList.add("visible","open");
    state="opened";showResult(false);els.mainBtn.disabled=true;
  }catch(e){}
}
function resetRitual(){
  $("stage").insertBefore(els.hero,$("flash"));
  state="idle";current=null;activeReadingIndex=0;$("stage").classList.remove("has-result");els.choiceLayer.innerHTML="";els.hero.className="hero-card";els.deck.className="deck";els.intro.style.opacity="1";
  els.result.classList.remove("show");els.mainBtn.disabled=false;els.mainBtn.textContent="开始洗牌";setStatus("",false);
}

els.mainBtn.addEventListener("click",()=>{if(state==="idle")startShuffle();else if(state==="waitingOpen")openHero();else if(state==="opened"&&!els.result.classList.contains("show")){showResult(false);els.mainBtn.disabled=true}});
els.hero.addEventListener("click",openHero);
$("soundBtn").addEventListener("click",()=>{soundOn=!soundOn;$("soundBtn").textContent=`♪ 音效：${soundOn?"开":"关"}`;if(soundOn)playTone("soft")});
$("clearTodayBtn").addEventListener("click",()=>{try{localStorage.removeItem(TODAY_KEY)}catch(e){}resetRitual();toast("已重新开始，可以再次抽牌")});
$("closeResultBtn").addEventListener("click",()=>{
  $("stage").insertBefore(els.hero,$("flash"));
  els.result.classList.remove("show");$("stage").classList.remove("has-result");
  els.mainBtn.disabled=false;els.mainBtn.textContent="再次查看牌义";
});

/* 鼠标悬停时轻微 3D 倾斜 */
els.hero.addEventListener("mousemove",e=>{
  if(!els.hero.classList.contains("visible"))return;
  const r=els.hero.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  els.hero.style.transform=`rotateX(${(-y*2.5).toFixed(2)}deg) rotateY(${(x*3).toFixed(2)}deg)`;
});
els.hero.addEventListener("mouseleave",()=>els.hero.style.transform="");

/* 点击星屑 */
document.addEventListener("pointerdown",e=>{
  if(e.target.closest(".editor"))return;
  for(let i=0;i<5;i++){
    const s=document.createElement("span");s.className="ripple-star";s.textContent=i%2?"✦":"✧";
    s.style.left=(e.clientX+(Math.random()-.5)*20)+"px";s.style.top=(e.clientY+(Math.random()-.5)*20)+"px";
    document.body.appendChild(s);setTimeout(()=>s.remove(),1200);
  }
});

/* 编辑器 */
function fillSelect(){
  els.select.innerHTML="";
  deckData.forEach((c,i)=>{
    const o=document.createElement("option");o.value=i;o.textContent=`${String(i+1).padStart(2,"0")} · ${c.name} / ${c.en}`;els.select.appendChild(o);
  });
}
function openEditor(index=null){
  fillSelect();
  if(index!=null)els.select.value=index;
  loadEditorCard(Number(els.select.value||0));
  els.editor.classList.add("show");els.mask.classList.add("show");
}
function closeEditor(){els.editor.classList.remove("show");els.mask.classList.remove("show")}
$("editBtn").addEventListener("click",()=>openEditor());
$("editCurrentBtn").addEventListener("click",()=>openEditor(current?.index??0));
$("closeEditorBtn").addEventListener("click",closeEditor);els.mask.addEventListener("click",closeEditor);
els.select.addEventListener("change",()=>loadEditorCard(Number(els.select.value)));

function setField(id,v){$(id).value=v??""}
function loadEditorCard(index){
  const c=deckData[index];
  editorImageUpright=c.imageUpright||"";
  editorImageReversed=c.imageReversed||"";
  $("uprightInput").value="";
  $("reversedInput").value="";
  setField("fName",c.name);setField("fEn",c.en);setField("fNumber",c.number);setField("fSymbol",c.symbol);
  setField("uKeywords",c.upright.keywords);setField("uSummary",c.upright.reading.summary);
  c.upright.reading.notes.forEach((note,i)=>setField(`uNote${i+1}`,note));setField("uQuestion",c.upright.reading.question);
  setField("rKeywords",c.reversed.keywords);setField("rSummary",c.reversed.reading.summary);
  c.reversed.reading.notes.forEach((note,i)=>setField(`rNote${i+1}`,note));setField("rQuestion",c.reversed.reading.question);
  renderPreview();
}
function renderPreview(){
  const sources=[
    ["uprightPreview",editorImageUpright],
    ["reversedPreview",editorImageReversed]
  ];
  sources.forEach(([id,source])=>{
    const p=$(id);p.replaceChildren();
    if(!source){p.textContent="暂无图片";return}
    const img=new Image();img.alt=id==="uprightPreview"?"正位":"逆位";
    img.onerror=()=>{p.textContent="图片不存在，请检查名称"};
    img.src=source;p.appendChild(img);
  });
}
async function onImageUpload(event,orientation){
  const file=event.target.files?.[0];if(!file)return;
  try{
    const imgData=await compressImage(file,700,1100,.82);
    if(orientation==="upright") editorImageUpright=imgData;
    else editorImageReversed=imgData;
    renderPreview();toast("图片已载入，点击保存修改生效");
  }catch(err){toast("图片读取失败")}
}
$("uprightInput").addEventListener("change",e=>onImageUpload(e,"upright"));
$("reversedInput").addEventListener("change",e=>onImageUpload(e,"reversed"));
$("resetUprightBtn").addEventListener("click",()=>{
  const i=Number(els.select.value);
  editorImageUpright=DEFAULT_DECK[i].imageUpright;
  $("uprightInput").value="";renderPreview();toast("已恢复默认正位图，请点击保存");
});
$("resetReversedBtn").addEventListener("click",()=>{
  const i=Number(els.select.value);
  editorImageReversed=DEFAULT_DECK[i].imageReversed;
  $("reversedInput").value="";renderPreview();toast("已恢复默认逆位图，请点击保存");
});
function compressImage(file,maxW,maxH,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height,scale=Math.min(1,maxW/w,maxH/h);w=Math.round(w*scale);h=Math.round(h*scale);
      const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",quality));
    };
    img.onerror=reject;img.src=url;
  });
}
$("saveCardBtn").addEventListener("click",()=>{
  const i=Number(els.select.value),c=deckData[i];
  c.name=$("fName").value.trim()||c.name;c.en=$("fEn").value.trim()||c.en;c.number=$("fNumber").value.trim();c.symbol=$("fSymbol").value.trim()||"✦";
  c.imageUpright=editorImageUpright;
  c.imageReversed=editorImageReversed;
  delete c.image;
  c.upright={keywords:$("uKeywords").value,reading:{summary:$("uSummary").value,notes:[$("uNote1").value,$("uNote2").value,$("uNote3").value],question:$("uQuestion").value}};
  c.reversed={keywords:$("rKeywords").value,reading:{summary:$("rSummary").value,notes:[$("rNote1").value,$("rNote2").value,$("rNote3").value],question:$("rQuestion").value}};
  try{saveOverrides();fillSelect();els.select.value=i;toast("卡牌已保存到本地")}
  catch(e){toast("保存失败：图片可能太大，请换小一点的图片")}
  if(current?.index===i){prepareHero(c,current.reversed);if(state==="opened")els.hero.classList.add("open"),showResult(false)}
});
$("resetCardBtn").addEventListener("click",()=>{
  const i=Number(els.select.value);deckData[i]=deepClone(DEFAULT_DECK[i]);
  try{saveOverrides();loadEditorCard(i);toast("这张牌已恢复默认")}
  catch(e){toast("恢复失败：浏览器存储不可用")}
  if(current?.index===i){prepareHero(deckData[i],current.reversed);if(state==="opened")els.hero.classList.add("open"),showResult(false)}
});

/* 漂浮星点 */
setInterval(()=>{
  const p=document.createElement("i");p.className="particle";p.style.left=(Math.random()*innerWidth)+"px";p.style.top=(innerHeight*.75+Math.random()*innerHeight*.2)+"px";
  p.style.setProperty("--x",((Math.random()-.5)*80)+"px");p.style.setProperty("--y",(-80-Math.random()*150)+"px");p.style.setProperty("--dur",(2.5+Math.random()*2.5)+"s");
  p.style.opacity=".45";document.body.appendChild(p);setTimeout(()=>p.remove(),5200);
},520);

restoreToday();
</script>
